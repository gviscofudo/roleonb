<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — La Maldo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#F4510A; --orange-dark:#C93E06; --orange-lite:#FEF0EA;
    --ink:#111111; --ink3:#888888; --border:rgba(0,0,0,0.08); --border2:rgba(0,0,0,0.14);
    --green:#0A8A4A; --green-light:#E8F8F0; --r:12px; --sh:0 1px 3px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.05);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#F7F7F7; font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:var(--ink); }
  .header{ background:var(--white,#fff); border-bottom:2px solid var(--orange); padding:0 1.25rem; height:60px;
    display:flex; align-items:center; gap:12px; box-shadow:0 2px 12px rgba(244,81,10,0.08); }
  .header img{ height:26px; display:block; }
  .header .hdiv{ width:1px; height:20px; background:var(--border2); }
  .header .htitle{ font-size:13px; color:var(--ink3); font-weight:500; }
  .wrap{ max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }
  .login-box{ max-width: 380px; margin: 80px auto; background:#fff; border-radius:var(--r); border:1px solid var(--border);
    box-shadow: var(--sh); padding: 28px; }
  .login-box h2{ margin-top:0; }
  .login-box input{ width:100%; padding:12px 14px; border:1.5px solid var(--border2); border-radius:8px; font-size:14px; margin-bottom:14px; font-family:inherit; }
  .login-box input:focus{ outline:none; border-color:var(--orange); }
  .login-box button{ width:100%; background: var(--orange); color:#fff; border:none; padding:12px; border-radius:8px;
    font-weight:700; cursor:pointer; font-size:13px; font-family:inherit; }
  .login-box button:hover{ background: var(--orange-dark); }
  .error{ color:#C0392B; font-size:12.5px; margin-bottom:10px; display:none; }
  table{ width:100%; border-collapse:collapse; background:#fff; border-radius:var(--r); overflow:hidden; box-shadow:var(--sh); border:1px solid var(--border); }
  th,td{ text-align:left; padding: 12px 14px; font-size:13.5px; border-bottom:1px solid var(--border); }
  th{ background:#FAFAFB; font-weight:700; color:var(--ink3); text-transform:uppercase; font-size:11px; letter-spacing:0.5px; }
  tr:hover td{ background:#FAFAFB; cursor:pointer; }
  .score-pill{ display:inline-block; padding:3px 10px; border-radius:20px; font-weight:700; font-size:12.5px; }
  .score-high{ background: var(--green-light); color: var(--green); }
  .score-mid{ background: var(--orange-lite); color:var(--orange-dark); }
  .score-low{ background:#FEE2E2; color:#B91C1C; }
  .detail{ display:none; background:#fff; border-radius:var(--r); border:1px solid var(--border); padding:20px; margin-top:16px; box-shadow:var(--sh); }
  .detail.show{ display:block; }
  .bar-row{ margin-bottom:12px; }
  .bar-label{ display:flex; justify-content:space-between; font-size:12px; font-weight:600; margin-bottom:5px; }
  .bar-track{ background:#EDEEF0; height:9px; border-radius:5px; overflow:hidden; border:1px solid var(--border); }
  .bar-fill{ height:100%; background: var(--orange); }
  .choices{ margin-top:16px; font-size:12.5px; line-height:1.6; white-space:pre-wrap; background:#FAFAFB; border-radius:10px; padding:14px; max-height:260px; overflow-y:auto; }
  .summary-block{ background: var(--orange-lite); border-left:3px solid var(--orange); border-radius:0 10px 10px 0;
    padding:14px 16px; font-size:13.5px; line-height:1.6; margin: 14px 0 18px; }
  .profile-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
  .profile-item{ border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:#FAFAFB; }
  .profile-skill{ font-weight:800; font-size:12.5px; margin-bottom:4px; }
  .profile-scene{ font-weight:400; color: var(--ink3); }
  .profile-choice{ font-size:12.5px; font-style:italic; color: var(--ink3); margin-bottom:6px; }
  .profile-note{ font-size:12.5px; line-height:1.5; }
  .empty{ text-align:center; padding:40px; color:var(--ink3); }
  .refresh{ background:transparent; border:1px solid var(--ink); color:var(--ink); padding:8px 14px; border-radius:8px; cursor:pointer; font-size:12.5px; font-weight:700; }
</style>
</head>
<body>
<header class="header">
  <img src="https://fu.do/assets/img/fudo_logo_color-15654b45.svg" alt="Fudo">
  <div class="hdiv"></div>
  <span class="htitle">Panel de Admin — La Maldo</span>
</header>

<div id="loginScreen" class="wrap">
  <div class="login-box">
    <h2>🔒 Panel de admin</h2>
    <p style="color:var(--ink3); font-size:13px;">Ingresá la contraseña para ver los resultados.</p>
    <div class="error" id="loginError">Contraseña incorrecta.</div>
    <input id="passInput" type="password" placeholder="Contraseña" onkeydown="if(event.key==='Enter') doLogin()">
    <button onclick="doLogin()">Entrar</button>
  </div>
</div>

<div id="adminScreen" class="wrap" style="display:none;">
  <div class="hud" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <span style="font-weight:800;">Resultados</span>
    <button class="refresh" onclick="loadResults()">↻ Actualizar</button></div>
  <div id="tableWrap"></div>
  <div id="detailBox" class="detail"></div>
</div>

<script>
const FUNCTION_URL = "https://xkqopmcfwxpajbvjgclg.supabase.co/functions/v1/roleonb-admin";
const SKILL_LABELS = {
  comunicacion:"Comunicación", empatia:"Empatía / escucha activa", resolucion:"Resolución de problemas",
  negociacion:"Negociación y objeciones", orientacion:"Orientación al cliente",
  adaptabilidad:"Adaptabilidad", presion:"Trabajo bajo presión", priorizacion:"Priorización"
};
const SKILL_MAX = { comunicacion:2, empatia:2, resolucion:2, negociacion:2, orientacion:2, adaptabilidad:2, presion:2, priorizacion:2 };

let currentPass = "";
let results = [];

function doLogin(){
  const pass = document.getElementById("passInput").value;
  currentPass = pass;
  loadResults();
}

async function loadResults(){
  try{
    const res = await fetch(`${FUNCTION_URL}?pass=${encodeURIComponent(currentPass)}`);
    const data = await res.json();
    if(!res.ok){
      document.getElementById("loginError").style.display = "block";
      return;
    }
    document.getElementById("loginError").style.display = "none";
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("adminScreen").style.display = "block";
    results = data.results || [];
    renderTable();
  } catch(err){
    document.getElementById("loginError").textContent = "Error de conexión. Probá de nuevo.";
    document.getElementById("loginError").style.display = "block";
  }
}

function scoreClass(score){
  if(score >= 70) return "score-high";
  if(score >= 45) return "score-mid";
  return "score-low";
}

function renderTable(){
  const wrap = document.getElementById("tableWrap");
  if(results.length === 0){
    wrap.innerHTML = `<div class="empty">Todavía no hay candidatos registrados.</div>`;
    return;
  }
  const rows = results.map((r,i) => `
    <tr onclick="showDetail(${i})">
      <td>${r.candidate_name}</td>
      <td>${r.candidate_email}</td>
      <td><span class="score-pill ${scoreClass(r.total_score)}">${r.total_score}%</span></td>
      <td>${new Date(r.created_at).toLocaleString("es-AR")}</td>
    </tr>
  `).join("");
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Nombre</th><th>Email</th><th>Puntaje</th><th>Fecha</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function showDetail(i){
  const r = results[i];
  const bars = Object.keys(SKILL_LABELS).map(k => {
    const pct = Math.min(100, Math.round(((r.scores[k]||0)/SKILL_MAX[k])*100));
    return `<div class="bar-row"><div class="bar-label"><span>${SKILL_LABELS[k]}</span><span>${pct}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div></div>`;
  }).join("");
  const choicesText = (r.choices||[]).map((c,idx) => `${idx+1}. ${c.scene}\n   → ${c.choice}\n`).join("\n");
  const synthesisHtml = (r.synthesis||[]).map(s => `
    <div class="profile-item">
      <div class="profile-skill">${s.skill} — <span class="profile-scene">${s.scene}</span></div>
      <div class="profile-choice">Respondió: "${s.choice}"</div>
      <div class="profile-note">${s.note}</div>
    </div>
  `).join("");
  const box = document.getElementById("detailBox");
  box.innerHTML = `
    <h3 style="margin-top:0;">${r.candidate_name} — ${r.total_score}%</h3>
    <div class="summary-block">${r.overall_summary || "Sin resumen disponible para este candidato."}</div>
    ${bars}
    <h4 style="margin: 20px 0 10px;">Perfil de competencias — detalle por mesa</h4>
    <div class="profile-list">${synthesisHtml || "<p style='color:var(--ink3); font-size:13px;'>Sin detalle disponible.</p>"}</div>
    <h4 style="margin: 20px 0 10px;">Registro completo de elecciones</h4>
    <div class="choices">${choicesText}</div>
  `;
  box.classList.add("show");
  box.scrollIntoView({ behavior:"smooth", block:"start" });
}
</script>
</body>
</html>
