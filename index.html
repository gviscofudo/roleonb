<title>El Salón — Simulador de Onboarding</title>
<style>
  :root{
    --fudo-orange: #FF5A1F;
    --fudo-orange-dark: #E1490F;
    --fudo-orange-light: #FFE4D6;
    --bg-dark: #15171C;
    --bg-floor: #F3F4F6;
    --grid-dot: #DCDFE4;
    --card-white: #FFFFFF;
    --ink: #191B1F;
    --ink-soft: #6B7280;
    --line: #E5E7EB;
    --green: #16A34A;
    --green-light: #DCFCE7;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background: var(--bg-dark);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); min-height:100vh; }
  .app{ max-width: 720px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding: 18px 14px 40px; }
  .hud{ display:flex; justify-content:space-between; align-items:center; padding: 12px 18px;
    background: var(--bg-dark); border: 1px solid #2a2d34; border-radius: 12px; margin-bottom: 14px; font-size: 13px; }
  .hud-left{ font-weight:800; color: #fff; display:flex; align-items:center; gap:8px; }
  .hud-left .dot{ width:9px; height:9px; border-radius:50%; background: var(--fudo-orange); box-shadow: 0 0 8px var(--fudo-orange); }
  .hud-right{ color: #9CA3AF; font-size:12.5px; font-weight:600; }

  .floor-wrap{ position:relative; width:100%; aspect-ratio: 4 / 4.4;
    background: radial-gradient(circle, var(--grid-dot) 1.4px, transparent 1.4px) 0 0/26px 26px, var(--bg-floor);
    border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 20px 50px -24px rgba(0,0,0,0.5); overflow:hidden; }

  .barra{ position:absolute; left: 50%; top: 90%; transform: translate(-50%,-50%); width: 36%; height: 9%;
    background: var(--bg-dark); border-radius: 10px; display:flex; align-items:center; justify-content:center;
    font-size: 11.5px; font-weight:700; color: var(--fudo-orange); z-index:2; }

  .table{ position:absolute; width: 15%; aspect-ratio: 1/1; transform: translate(-50%,-50%); z-index:3; cursor: default;
    transition: opacity 0.3s ease, transform 0.2s ease; }
  .table .top{ width:100%; height:100%; border-radius: 20%; background: var(--card-white); border: 2.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex-direction: column; font-weight:800; color: var(--ink);
    font-size: 15px; box-shadow: 0 8px 18px -10px rgba(0,0,0,0.25); position:relative; transition: all 0.2s ease; }
  .table .top .icon{ font-size: 15px; line-height:1; margin-bottom:2px; opacity:0.55; }
  .table .chair{ position:absolute; width:16%; height:16%; background: #C7CBD1; border-radius: 4px; }
  .table .chair.c1{ top:-11%; left:42%; } .table .chair.c2{ bottom:-11%; left:42%; }
  .table .chair.c3{ left:-11%; top:42%; } .table .chair.c4{ right:-11%; top:42%; }
  .table.idle .top{ opacity:0.55; }
  .table.active .top{ border-color: var(--fudo-orange); background: var(--fudo-orange-light); animation: glow 1.3s ease-in-out infinite; }
  .table.active .top .icon{ opacity:1; }
  .table.done .top{ border-color: var(--green); background: var(--green-light); opacity: 0.85; }
  .table.clickable{ cursor:pointer; }
  .table.clickable:hover .top{ transform: scale(1.08); }
  @keyframes glow{ 0%,100%{ box-shadow: 0 8px 18px -10px rgba(0,0,0,0.25), 0 0 0px rgba(255,90,31,0.0); }
    50%{ box-shadow: 0 8px 18px -10px rgba(0,0,0,0.25), 0 0 0 6px rgba(255,90,31,0.18); } }

  .call-badge{ position:absolute; top:-24%; left:50%; transform: translateX(-50%); background: var(--fudo-orange); color: #fff;
    font-size: 9.5px; font-weight:700; padding: 3px 8px; border-radius: 20px; white-space: nowrap; display:none; }
  .table.active .call-badge{ display:block; }
  .done-check{ position:absolute; top:-10%; right:-8%; background: var(--green); color:#fff; width:22px; height:22px;
    border-radius:50%; display:none; align-items:center; justify-content:center; font-size:12px; font-weight:900;
    border:2.5px solid var(--bg-floor); }
  .table.done .done-check{ display:flex; }

  .waiter{ position:absolute; width: 13%; aspect-ratio:1/1; transform: translate(-50%,-50%); z-index: 5;
    transition: left 0.7s ease-in-out, top 0.7s ease-in-out; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background: var(--fudo-orange); box-shadow: 0 10px 20px -8px rgba(255,90,31,0.6), 0 0 0 4px #fff; font-size: 20px; }
  .waiter.walking{ animation: bob 0.32s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform: translate(-50%,-50%) translateY(0); } 50%{ transform: translate(-50%,-50%) translateY(-8%); } }

  .overlay{ position:fixed; inset:0; background: rgba(15,17,20,0.65); display:flex; align-items:center; justify-content:center;
    padding: 20px; z-index: 20; }
  .overlay.hidden{ display:none; }
  .card{ background: var(--card-white); color: var(--ink); width: 100%; max-width: 480px; max-height: 86vh; overflow-y:auto;
    border-radius: 18px; padding: 28px 26px 26px; box-shadow: 0 30px 70px -20px rgba(0,0,0,0.5); animation: cardIn 0.35s ease; }
  @keyframes cardIn{ from{ opacity:0; transform: translateY(16px) scale(0.98); } to{ opacity:1; transform: translateY(0) scale(1); } }
  .card .eyebrow{ font-size: 11px; letter-spacing: 1.5px; text-transform:uppercase; color: var(--fudo-orange); font-weight:800; margin-bottom: 6px; }
  .card h2{ font-size: 19px; margin: 0 0 14px; font-weight:800; }
  .card p.body{ font-size: 14.5px; line-height:1.6; margin-bottom: 20px; white-space: pre-wrap; }
  .opt{ display:block; width:100%; text-align:left; background: #fff; border: 1.5px solid var(--line); color: var(--ink);
    padding: 13px 15px; margin-bottom:9px; font-family: inherit; font-size: 13.5px; line-height:1.5; cursor:pointer;
    border-radius:10px; transition: all 0.15s ease; }
  .opt:hover{ background: var(--fudo-orange-light); border-color: var(--fudo-orange); }
  .opt .k{ font-weight:800; color: var(--fudo-orange); margin-right:6px; }
  .opt:disabled{ opacity:0.4; cursor:default; }
  .opt.chosen{ border-color: var(--green); background: var(--green-light); }
  .feedback{ font-size:13px; background: #F3F4F6; border-left:3px solid var(--fudo-orange); padding:12px 14px; margin: 4px 0 18px;
    border-radius: 0 8px 8px 0; display:none; }
  .feedback.show{ display:block; }
  .btn{ background: var(--ink); color: #fff; border:none; padding:12px 22px; font-family:inherit; font-size:12.5px;
    font-weight:700; cursor:pointer; border-radius:10px; }
  .btn:hover{ background:#000; }
  .btn.primary{ background: var(--fudo-orange); }
  .btn.primary:hover{ background: var(--fudo-orange-dark); }
  .btn.hidden{ display:none; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size:12px; font-weight:700; margin-bottom:5px; color: var(--ink-soft); }
  .field input{ width:100%; padding: 11px 13px; border:1.5px solid var(--line); border-radius:10px; font-size:14px; font-family:inherit; }
  .field input:focus{ outline:none; border-color: var(--fudo-orange); }
  .rush-list{ margin: 6px 0 18px; padding:0; list-style:none; }
  .rush-list li{ font-size: 12.5px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; margin-bottom: 8px;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .rush-list li:hover{ border-color: var(--fudo-orange); background: var(--fudo-orange-light); }
  .rush-list li.picked{ opacity:0.5; cursor:default; background:#F3F4F6; }
  .rush-list li .order-num{ background: var(--fudo-orange); color:#fff; width:20px; height:20px; border-radius:50%;
    display:none; align-items:center; justify-content:center; font-size:11px; margin-right:8px; flex-shrink:0; }
  .rush-list li.picked .order-num{ display:inline-flex; }
  .footer-note{ color:#6B7280; font-size:11px; text-align:center; margin-top:14px; }
</style>
</head>

function setActive(ids){
  Object.keys(TABLE_POS).forEach(id => document.getElementById("table-"+id).classList.remove("active","clickable"));

  const email = document.getElementById("loginEmail").value.trim();
  if(!name || !email || !email.includes("@")){
    alert("Completá tu nombre y un email válido para continuar.");
    return;
  }
  candidate = { name, email };
  showIntro();
}
showLogin();

// ---- INTRO ----
function showIntro(){
  showOverlay(`
    <div class="card">
      <div class="eyebrow">Simulador de turno</div>
      <h2>Bienvenido, ${candidate.name.split(" ")[0]}</h2>
      <p class="body">Hoy cubrís un turno como Ejecutivo de Onboarding. A medida que las mesas se iluminan, te están llamando clientes de tu día a día.

Prestá atención: no siempre la mejor respuesta es la más obvia, ni está siempre en el mismo lugar.</p>
      <button class="btn primary" onclick="startGame()">Empezar turno →</button>
    </div>
  `);
}
function startGame(){ hideOverlay(); activateTable(1); }
function activateTable(id){ setActive([id]); }

function onTableClick(id){
  const el = document.getElementById("table-"+id);
  if(!el.classList.contains("clickable")) return;
  el.classList.remove("clickable","active");
  const pos = TABLE_POS[id];
  moveWaiterTo(pos.x, pos.y-7, () => { id === 8 ? openRush() : openScenario(id); });
}

function openScenario(id){
  const s = singleScenes[id];
  let optsHtml = s.options.map((opt,idx) => {
    const letter = String.fromCharCode(65+idx);
    return `<button class="opt" onclick="answerScenario(${id},${idx})"><span class="k">${letter}.</span>${opt.text}</button>`;
  }).join("");
  showOverlay(`
    <div class="card">
      <div class="eyebrow">${s.skillLabel}</div>
      <h2>${s.scene}</h2>
      <p class="body">${s.body}</p>
      <div id="scenarioOpts">${optsHtml}</div>
      <div class="feedback" id="scenarioFeedback">Elección registrada.</div>
      <button class="btn hidden" id="scenarioNext" onclick="closeScenario(${id})">Volver al salón →</button>
    </div>
  `);
}
function answerScenario(id, idx){
  const s = singleScenes[id];
  const chosen = s.options[idx];
  Object.keys(chosen.tags).forEach(k => scores[k] += chosen.tags[k]);
  choiceLog.push({ scene:s.scene, choice:chosen.text });
  synthesisLog.push({ skill:s.skillLabel, scene:s.scene, choice:chosen.text, note:chosen.note });
  document.querySelectorAll("#scenarioOpts .opt").forEach((btn,i) => { btn.disabled=true; if(i===idx) btn.classList.add("chosen"); });
  document.getElementById("scenarioFeedback").classList.add("show");
  document.getElementById("scenarioNext").classList.remove("hidden");
}
function closeScenario(id){
  hideOverlay(); setDone(id);
  if(id === 7){ setTimeout(() => activateTable(8), 300); }
  else { setTimeout(() => activateTable(id+1), 300); }
}

// ---- Hora pico (mesa 8, priorización) ----
function openRush(){
  rushPicked = [];
  renderRush();
}
function renderRush(){
  const items = rushOptions.map(o => {
    const picked = rushPicked.includes(o.id);
    const num = picked ? rushPicked.indexOf(o.id)+1 : "";
    return `<li class="${picked?'picked':''}" onclick="${picked?'':`pickRush('${o.id}')`}">
      <span class="order-num">${num}</span><span>${o.detail}</span></li>`;
  }).join("");
  showOverlay(`
    <div class="card">
      <div class="eyebrow">Priorización</div>
      <h2>Mesa 8 — Hora pico</h2>
      <p class="body">Tres clientes te necesitan al mismo tiempo. Hacé clic en el orden en que los atenderías.</p>
      <ul class="rush-list">${items}</ul>
      <button class="btn hidden" id="rushNext" onclick="closeRush()">Volver al salón →</button>
    </div>
  `);
  if(rushPicked.length === 3){
    document.getElementById("rushNext").classList.remove("hidden");
  }
}
function pickRush(id){
  if(rushPicked.includes(id)) return;
  rushPicked.push(id);
  const opt = rushOptions.find(o => o.id === id);
  if(rushPicked.length === 1){
    Object.keys(opt.pts).forEach(k => scores[k] += opt.pts[k]);
    synthesisLog.push({ skill:"Priorización", scene:"Hora pico", choice:opt.label, note:rushNotes[opt.id] });
  }
  choiceLog.push({ scene:"Hora pico (priorización)", choice:`Posición ${rushPicked.length}: ${opt.label}` });
  renderRush();
}
function closeRush(){ hideOverlay(); setDone(8); finishGame(); }

// ---- Cierre (scoring oculto, no se muestra al candidato) ----
function buildOverallSummary(pctByskill){
  const entries = Object.keys(pctByskill).map(k => ({ k, label:SKILL_LABELS[k], pct:pctByskill[k] }));
  entries.sort((a,b) => b.pct - a.pct);
  const top = entries.slice(0,2).map(e => e.label);
  const bottom = entries.slice(-2).map(e => e.label).reverse();
  const avg = entries.reduce((s,e) => s+e.pct, 0) / entries.length;

  let nivel;
  if(avg >= 70) nivel = "En términos generales, el perfil se mostró sólido y consistente a lo largo del turno.";
  else if(avg >= 45) nivel = "En términos generales, el perfil mostró un desempeño mixto, con fortalezas puntuales y otras aptitudes menos desarrolladas.";
  else nivel = "En términos generales, el perfil mostró varias oportunidades de desarrollo a lo largo del turno.";

  return `${nivel} Las aptitudes donde más se destacó fueron ${top.join(" y ")}. Las que más margen de mejora mostraron fueron ${bottom.join(" y ")}. Este resumen está armado en base a las respuestas concretas que se ven en el detalle de cada mesa, no es una evaluación clínica ni un diagnóstico formal — es una guía para conversar en la devolución.`;
}

function finishGame(){
  let total = 0;
  const pctByskill = {};
  Object.keys(SKILL_MAX).forEach(k => {
    const pct = Math.min(1, scores[k]/SKILL_MAX[k]);
    pctByskill[k] = Math.round(pct*100);
    total += pct;
  });
  const totalScore = Math.round((total / Object.keys(SKILL_MAX).length) * 100);
  const overallSummary = buildOverallSummary(pctByskill);

  showOverlay(`
    <div class="card">
      <div class="eyebrow">Turno finalizado</div>
      <h2>¡Gracias, ${candidate.name.split(" ")[0]}!</h2>
      <p class="body">Completaste el turno de prueba. Tu responsable de selección va a revisar los resultados y se va a poner en contacto con vos.</p>
    </div>
  `);

  fetch(`${SUPABASE_URL}/rest/v1/roleonb_results`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      "Prefer": "return=minimal"
    },
    body: JSON.stringify({
      candidate_name: candidate.name,
      candidate_email: candidate.email,
      total_score: totalScore,
      scores: scores,
      choices: choiceLog,
      synthesis: synthesisLog,
      overall_summary: overallSummary
    })
  }).catch(err => console.error("Error guardando resultado:", err));
}
</script>
